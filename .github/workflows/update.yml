name: تحديث بيانات الدوري

on:
  schedule:
    # كل يوم اثنين 11:00 UTC = 2:00 ظهراً بتوقيت الرياض
    - cron: '0 11 * * 1'
    # وكل خميس 15:00 UTC = 6:00 مساءً بتوقيت الرياض (قبل الإقفال)
    - cron: '0 15 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: سحب البيانات
        env:
          LEAGUE_ID: '1393'
        run: node fetch.mjs

      - name: حفظ التغييرات
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "تحديث بيانات الجولة"
          git push
