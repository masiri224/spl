name: تحديث بيانات الدوري

on:
  schedule:
    # كل ٣ ساعات — يغطي أوقات المباريات وما بعدها
    - cron: '0 */3 * * *'
  workflow_dispatch:        # زر تشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: سحب البيانات
        env:
          LEAGUE_ID: '1393'
        run: node fetch.mjs

      - name: حفظ التغييرات
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history
          git diff --staged --quiet || git commit -m "تحديث بيانات الجولة"
          git push
